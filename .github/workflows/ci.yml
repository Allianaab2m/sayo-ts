name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @sayo-ts/cli runs on core's compiled output, so build in dependency order
      - name: Build
        run: pnpm -r --filter "./packages/*" run build

      - name: Type check
        run: pnpm -r run check

      # --if-present must come before the script name, or pnpm forwards it
      - name: Test
        run: pnpm -r run --if-present test

      # The api template must pass what `vp create @sayo-ts` users run first
      - name: Template (vp check, vp test)
        working-directory: packages/create/templates/api
        run: |
          pnpm exec vp check
          pnpm exec vp test
